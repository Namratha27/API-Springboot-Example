spring.application.name=file-upload-service
server.port=8081
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
management.endpoints.web.exposure.include=health,info
spring.datasource.url=jdbc:h2:mem:file_upload_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
file-upload.max-bytes=26214400
file-upload.scanner-enabled=false
file-upload.scanner-url=http://localhost:9081/scan
