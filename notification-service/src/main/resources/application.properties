spring.application.name=notification-service
server.port=8083
management.endpoints.web.exposure.include=health,info
spring.datasource.url=jdbc:h2:mem:notification_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
notifications.dry-run=true
notifications.max-attempts=3
notifications.email-url=http://localhost:9083/providers/email
notifications.sms-url=http://localhost:9083/providers/sms
notifications.push-url=http://localhost:9083/providers/push
