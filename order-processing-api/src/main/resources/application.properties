spring.application.name=order-processing-api
server.port=8089
management.endpoints.web.exposure.include=health,info
spring.datasource.url=jdbc:h2:mem:order_processing_api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
orders.dry-run=true
orders.inventory-url=http://localhost:8088/reservations
orders.payment-url=http://localhost:9090/payments/authorizations
